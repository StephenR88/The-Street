<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Street</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #0b0c10;
        overflow: hidden;
        height: 100%;
      }
      #app {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
      }
      canvas {
        image-rendering: pixelated;
        background: #1a1f2b;
      }
      #hud {
        position: fixed;
        top: 8px;
        left: 8px;
        color: #eaeaea;
        font-family: "Courier New", monospace;
        font-size: 12px;
        background: rgba(0, 0, 0, 0.55);
        padding: 8px 10px;
        border-radius: 4px;
        white-space: pre;
        pointer-events: none;
        max-width: 320px;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="game" width="960" height="360"></canvas>
    </div>
    <div id="hud"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
